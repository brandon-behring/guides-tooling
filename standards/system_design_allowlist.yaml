# System-Design Allowlist for Silver Gating
#
# tier_model.md:39 requires Silver guides to include "at least 1 system/design
# scenario where applicable". This file defines the "where applicable"
# allowlist. `tooling.audits.fleet.audit_silver` fails the App-D gate for any
# guide on this list whose Appendix D lacks a system-design section.
#
# Criteria for inclusion: "Would a hiring manager at a company building this
# kind of system ask a system-design question specifically about this area in
# an IC5+/Staff AI-engineering interview?"
#
# Exclusions (NOT on this list, therefore exempt):
#  - Foundations / math / stats (manning_grokking_bayes, manning_grokking_statistics, etc.)
#  - RL theory (manning_deep_rl_in_action, manning_grokking_deep_rl)
#  - Framework tutorials with no production focus (manning_deep_learning_python_2e)
#  - Non-interview dev-tool tutorials
#  - Out-of-Interview-Scope waivers (docker, packaging, SE philosophy)
#  - Short algorithmic tutorials (manning_grokking_ai_algorithms_2e)
#
# Manning-only fleet: the former dlai_*/coursera_* entries were removed (no such
# guides exist here). Edit with review: adding removes a Silver FAIL, removing
# restores one. Keep justification in comments when the call is close.

required:
